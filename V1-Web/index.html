<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Promise Tracker</title>
<style>
  :root {
    --bg-color: #fafafa;
    --card-bg: #fff;
    --text-color: #1d1d1f;
    --text-muted: #6e6e73;
    --primary: #0071e3;
    --primary-hover: #005bb5;
    --danger: #ff3b30;
    --danger-hover: #d32f2f;
    --success: #34c759;
    --success-hover: #28a745;
    --shadow-light: rgba(0,0,0,0.1);
    --shadow-heavy: rgba(0,0,0,0.15);
    --border-radius: 14px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
  }
  [data-theme="dark"] {
    --bg-color: #1c1c1e;
    --card-bg: #2c2c2e;
    --text-color: #f0f0f3;
    --text-muted: #8e8e93;
    --primary: #0a84ff;
    --primary-hover: #005fcc;
    --danger: #ff453a;
    --danger-hover: #d32f2f;
    --success: #30d158;
    --success-hover: #28a745;
    --shadow-light: rgba(0,0,0,0.8);
    --shadow-heavy: rgba(0,0,0,0.95);
  }
  body {
    background: var(--bg-color);
    color: var(--text-color);
    font-family: var(--font-sans);
    margin: 0;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  h1 {
    font-weight: 600;
    font-size: 2.4rem;
    text-align: center;
    margin-bottom: 36px;
    letter-spacing: -0.03em;
  }
  .controls-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    margin-bottom: 32px;
  }
  /* Sélecteur de langue Apple-ish */
  .lang-select {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
    font-size: 0.95rem;
    font-family: var(--font-sans);
    cursor: pointer;
    color: var(--text-muted);
    border-radius: var(--border-radius);
    padding: 6px 14px;
    user-select: none;
    position: relative;
    border: 1.2px solid transparent;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .lang-select:hover,
  .lang-select:focus {
    color: var(--primary);
    border-color: var(--primary);
    outline: none;
    box-shadow: 0 0 6px var(--primary);
  }
  .lang-option {
    padding: 2px 6px;
    border-radius: 6px;
    user-select: none;
    transition: background-color 0.2s ease, color 0.2s ease;
  }
  .lang-option[aria-selected="true"] {
    font-weight: 700;
    color: var(--primary);
    background-color: rgba(0, 113, 227, 0.12);
  }
  .lang-option:hover:not([aria-selected="true"]) {
    background-color: rgba(0, 113, 227, 0.08);
  }
  .chevron {
    color: var(--text-muted);
    pointer-events: none;
    user-select: none;
    transition: color 0.2s ease;
  }
  .lang-select:hover .chevron,
  .lang-select:focus .chevron {
    color: var(--primary);
  }
  /* Bouton mode sombre */
  button.theme-toggle {
    border: none;
    background: var(--card-bg);
    padding: 12px 18px;
    font-size: 1.2rem;
    font-weight: 500;
    border-radius: var(--border-radius);
    box-shadow: 0 4px 12px var(--shadow-light);
    cursor: pointer;
    transition: background-color 0.3s ease, box-shadow 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  button.theme-toggle:hover {
    box-shadow: 0 6px 20px var(--shadow-heavy);
  }
  form {
    background: var(--card-bg);
    max-width: 480px;
    margin: 0 auto 48px auto;
    padding: 24px 32px;
    border-radius: var(--border-radius);
    box-shadow: 0 12px 28px var(--shadow-light);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  form input[type="text"],
  form input[type="date"],
  form textarea {
    border: 1.5px solid #d1d1d6;
    border-radius: var(--border-radius);
    padding: 14px 18px;
    font-size: 1rem;
    color: var(--text-color);
    background: var(--card-bg);
    font-weight: 400;
    transition: border-color 0.3s ease;
    font-family: var(--font-sans);
  }
  form textarea {
    resize: vertical;
    min-height: 80px;
  }
  form input[type="text"]:focus,
  form input[type="date"]:focus,
  form textarea:focus {
    border-color: var(--primary);
    outline: none;
    box-shadow: 0 0 8px var(--primary);
  }
  form button[type="submit"] {
    background-color: var(--primary);
    color: white;
    border-radius: var(--border-radius);
    padding: 14px;
    font-size: 1.1rem;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: background-color 0.25s ease;
    box-shadow: 0 8px 20px rgb(0 113 227 / 0.35);
  }
  form button[type="submit"]:hover {
    background-color: var(--primary-hover);
    box-shadow: 0 10px 28px rgb(0 91 181 / 0.6);
  }
  #promisesContainer {
    max-width: 600px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .promise {
    background: var(--card-bg);
    border-radius: var(--border-radius);
    box-shadow: 0 8px 20px var(--shadow-light);
    padding: 28px 32px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .promise h2 {
    margin: 0;
    font-weight: 600;
    font-size: 1.5rem;
    letter-spacing: -0.02em;
    color: var(--text-color);
  }
  .notes {
    font-size: 1rem;
    color: var(--text-muted);
    white-space: pre-wrap;
    font-style: italic;
  }
  .notes a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 600;
    transition: color 0.3s ease;
  }
  .notes a:hover {
    color: var(--primary-hover);
    text-decoration: underline;
  }
  .progress-bar {
    background: #e5e5ea;
    border-radius: 10px;
    overflow: hidden;
    height: 20px;
    box-shadow: inset 0 1px 3px rgb(0 0 0 / 0.1);
  }
  .progress {
    height: 100%;
    width: 0;
    border-radius: 10px;
    transition: width 0.5s ease-in-out;
    background: linear-gradient(90deg, var(--success), #a1de8a);
  }
  .progress.incomplete {
    background: linear-gradient(90deg, var(--danger), #f37c70);
  }
  .timer,
  .status {
    font-size: 0.9rem;
    color: var(--text-muted);
    font-weight: 500;
  }
  .controls {
    margin-top: 18px;
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  .controls input[type="number"] {
    border: 1.5px solid #d1d1d6;
    border-radius: var(--border-radius);
    padding: 12px 14px;
    font-size: 1rem;
    font-weight: 500;
    transition: border-color 0.3s ease;
  }
  .controls input[type="number"]:focus {
    border-color: var(--primary);
    outline: none;
    box-shadow: 0 0 8px var(--primary);
  }
  .controls button {
    padding: 12px 18px;
    border-radius: var(--border-radius);
    font-weight: 600;
    font-size: 1rem;
    border: none;
    cursor: pointer;
    transition: background-color 0.3s ease;
    box-shadow: 0 8px 20px var(--shadow-light);
  }
  .mark-done {
    background-color: var(--primary);
    color: white;
  }
  .mark-done:hover {
    background-color: var(--primary-hover);
    box-shadow: 0 10px 28px rgb(0 91 181 / 0.6);
  }
  .mark-incomplete {
    background-color: var(--danger);
    color: white;
  }
  .mark-incomplete:hover {
    background-color: var(--danger-hover);
    box-shadow: 0 10px 28px rgb(211 47 47 / 0.8);
  }
  .delete-button {
    background-color: #8e8e93;
    color: white;
  }
  .delete-button:hover {
    background-color: #6b6b70;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
  }
  .toggle-controls {
    font-size: 0.9rem;
    color: var(--primary);
    font-weight: 600;
    cursor: pointer;
    align-self: flex-end;
    user-select: none;
    transition: color 0.3s ease;
  }
  .toggle-controls:hover {
    color: var(--primary-hover);
  }
  /* Responsive */
  @media (max-width: 600px) {
    body {
      padding: 16px;
    }
    form {
      padding: 20px;
      max-width: 100%;
    }
    #promisesContainer {
      max-width: 100%;
      margin: 0;
    }
  }
</style>
</head>
<body>

  <h1 id="pageTitle">Suivi des Promesses</h1>

  <div class="controls-bar">
    <div class="lang-select" tabindex="0" role="listbox" aria-label="Choisir la langue" aria-activedescendant="lang-fr">
      <div class="lang-option" id="lang-fr" role="option" aria-selected="true" data-lang="fr">FR</div>
      <div class="lang-option" id="lang-en" role="option" aria-selected="false" data-lang="en">EN</div>
      <svg class="chevron" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path fill="none" stroke="currentColor" stroke-width="2" d="M6 9l6 6 6-6"/>
      </svg>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Basculer le mode sombre">🌓</button>
  </div>

  <form id="addPromiseForm" aria-label="Ajouter une promesse">
    <input type="text" id="promiseTitle" placeholder="Nom de la promesse" required aria-required="true" />
    <textarea id="promiseNotes" placeholder="Notes (optionnel)" aria-label="Notes de la promesse"></textarea>
    <input type="text" id="linkText" placeholder="Texte du lien (pour les URLs dans les notes)" aria-label="Texte personnalisé pour les liens" />
    <input type="date" id="promiseStart" required aria-required="true" />
    <input type="date" id="promiseEnd" required aria-required="true" />
    <button type="submit" id="addButton">Ajouter une Promesse</button>
  </form>

  <div id="promisesContainer" aria-live="polite" aria-relevant="additions removals"></div>

<script>
  const translations = {
    fr: {
      title: "Suivi des Promesses",
      addButton: "Ajouter une Promesse",
      placeholder: "Nom de la promesse",
      notesPlaceholder: "Notes (optionnel)",
      linkTextPlaceholder: "Texte du lien (pour les URLs dans les notes)",
      modify: "Modifier la progression",
      markDone: "Marquer comme accompli",
      markIncomplete: "Marquer comme incomplète",
      delete: "Supprimer la promesse",
      completed: "Statut : Accompli ✅",
      incomplete: "Statut : Incomplet ❌",
      progress: (perc) => `Progression : ${perc}%`,
      overdue: (days) => `Délai dépassé de ${days} jours`,
      remaining: (days) => `Temps restant : ${days} jours`,
    },
    en: {
      title: "Promise Tracker",
      addButton: "Add Promise",
      placeholder: "Promise Name",
      notesPlaceholder: "Notes (optional)",
      linkTextPlaceholder: "Link text (for URLs in notes)",
      modify: "Edit Progress",
      markDone: "Mark as Completed",
      markIncomplete: "Mark as Incomplete",
      delete: "Delete Promise",
      completed: "Status: Completed ✅",
      incomplete: "Status: Incomplete ❌",
      progress: (perc) => `Progress: ${perc}%`,
      overdue: (days) => `Overdue by ${days} days`,
      remaining: (days) => `${days} days remaining`,
    },
  };

  let currentLang = "fr";

  const promisesContainer = document.getElementById("promisesContainer");
  const addPromiseForm = document.getElementById("addPromiseForm");

  let promises = JSON.parse(localStorage.getItem("promises") || "[]");

  // Gestion du sélecteur de langue custom Apple-ish
  const langSelect = document.querySelector('.lang-select');
  const langOptions = langSelect.querySelectorAll('.lang-option');

  langOptions.forEach(option => {
    option.addEventListener('click', () => {
      langOptions.forEach(o => {
        o.setAttribute('aria-selected', 'false');
      });
      option.setAttribute('aria-selected', 'true');
      currentLang = option.getAttribute('data-lang');
      renderUI();
    });
  });

  function toggleTheme() {
    document.body.dataset.theme = document.body.dataset.theme === "dark" ? "" : "dark";
  }

  function savePromises() {
    localStorage.setItem("promises", JSON.stringify(promises));
  }

  function toggleControls(index) {
    const controls = document.getElementById(`controls-${index}`);
    controls.style.display = controls.style.display === "flex" ? "none" : "flex";
  }

  function deletePromise(index) {
    if (
      confirm(
        currentLang === "fr"
          ? "Êtes-vous sûr de vouloir supprimer cette promesse ?"
          : "Are you sure you want to delete this promise?"
      )
    ) {
      promises.splice(index, 1);
      savePromises();
      renderPromises();
    }
  }

  // Remplace les URLs dans le texte par des liens avec texte personnalisé
  function linkify(text, linkText) {
    if (!text) return "";
    if (!linkText) linkText = ""; // si vide, affichera l'url brute
    const urlRegex = /(\bhttps?:\/\/[^\s]+)/g;
    return text.replace(urlRegex, (url) => {
      const displayText = linkText.trim() !== "" ? linkText.trim() : url;
      return `<a href="${url}" target="_blank" rel="noopener noreferrer">${displayText}</a>`;
    });
  }

  function renderUI() {
    const t = translations[currentLang];
    document.getElementById("pageTitle").innerText = t.title;
    document.getElementById("promiseTitle").placeholder = t.placeholder;
    document.getElementById("promiseNotes").placeholder = t.notesPlaceholder;
    document.getElementById("linkText").placeholder = t.linkTextPlaceholder;
    document.getElementById("addButton").innerText = t.addButton;
    renderPromises();
  }

  function renderPromises() {
    promisesContainer.innerHTML = "";
    const now = new Date();

    promises.forEach((promise, index) => {
      const t = translations[currentLang];
      const startDate = new Date(promise.startDate);
      const endDate = new Date(promise.endDate);
      const totalTime = endDate - startDate;
      const elapsedTime = Math.min(now - startDate, totalTime);

      const percentage =
        promise.completed
          ? 100
          : promise.percentage !== undefined
          ? promise.percentage
          : Math.min(100, Math.max(0, (elapsedTime / totalTime) * 100));

      const remainingTime = endDate - now;
      let timeText = "";
      let statusText = "";

      if (promise.completed) {
        timeText = `${Math.floor(totalTime / (1000 * 60 * 60 * 24))} d`;
        statusText = t.completed;
      } else if (remainingTime > 0) {
        const daysLeft = Math.ceil(remainingTime / (1000 * 60 * 60 * 24));
        timeText = t.remaining(daysLeft);
        statusText = t.progress(percentage.toFixed(1));
      } else {
        const overdueDays = Math.abs(Math.floor(remainingTime / (1000 * 60 * 60 * 24)));
        timeText = t.overdue(overdueDays);
        statusText = t.progress(percentage.toFixed(1));
      }

      const progressClass = promise.completed ? "" : "incomplete";

      const notesHTML = linkify(promise.notes, promise.linkText);

      promisesContainer.innerHTML += `
        <section class="promise" aria-label="${promise.title}">
          <h2>${promise.title}</h2>
          <div class="notes">${notesHTML}</div>
          <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percentage.toFixed(
            1
          )}">
            <div class="progress ${progressClass}" style="width:${percentage}%"></div>
          </div>
          <div class="timer">${timeText}</div>
          <div class="status">${statusText}</div>
          <div class="toggle-controls" tabindex="0" role="button" aria-pressed="false" aria-label="${
            t.modify
          }" onclick="toggleControls(${index})" onkeypress="if(event.key==='Enter')toggleControls(${index})">${t.modify}</div>
          <div class="controls" id="controls-${index}">
            <input type="number" min="0" max="100" placeholder="%" aria-label="Changer le pourcentage" onchange="updatePercentage(${index}, this.value)" />
            <button class="mark-done" onclick="markCompleted(${index})" aria-label="${t.markDone}">${t.markDone}</button>
            <button class="mark-incomplete" onclick="markIncomplete(${index})" aria-label="${t.markIncomplete}">${t.markIncomplete}</button>
            <button class="delete-button" onclick="deletePromise(${index})" aria-label="${t.delete}">${t.delete}</button>
          </div>
        </section>
      `;
    });
  }

  function updatePercentage(index, value) {
    const val = Math.max(0, Math.min(100, Number(value)));
    promises[index].percentage = val;
    if (val >= 100 && promises[index].completed !== false) promises[index].completed = true;
    else if (val < 100 && promises[index].completed === true) promises[index].completed = false;
    savePromises();
    renderPromises();
  }

  function markCompleted(index) {
    promises[index].completed = true;
    promises[index].percentage = 100;
    savePromises();
    renderPromises();
  }

  function markIncomplete(index) {
    promises[index].completed = false;
    savePromises();
    renderPromises();
  }

  addPromiseForm.addEventListener("submit", (e) => {
    e.preventDefault();

    const title = document.getElementById("promiseTitle").value.trim();
    const notes = document.getElementById("promiseNotes").value.trim();
    const linkText = document.getElementById("linkText").value.trim();
    const startDate = document.getElementById("promiseStart").value;
    const endDate = document.getElementById("promiseEnd").value;

    if (new Date(startDate) >= new Date(endDate)) {
      alert(
        currentLang === "fr"
          ? "La date de fin doit être postérieure à la date de début."
          : "End date must be after start date."
      );
      return;
    }
    if (!title) {
      alert(currentLang === "fr" ? "Le nom de la promesse est obligatoire." : "Promise name is required.");
      return;
    }

    promises.push({ title, notes, linkText, startDate, endDate, completed: false });

    savePromises();
    renderPromises();

    addPromiseForm.reset();
  });

  renderUI();
  setInterval(renderPromises, 1000 * 60 * 5); // actualise toutes les 5 min
</script>
</body>
</html>
