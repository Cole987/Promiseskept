<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PromiseTracker Web</title>
  <style>
    /* Variables couleurs */
    :root {
      --orange: #f97316;
      --green: #22c55e;
      --red: #ef4444;
      --gray-light: #e5e7eb;
      --gray-dark: #374151;
      --bg: #ffffff;
      --text: #1f2937;
      --section-bg: #f9fafb;
      --input-bg: #ffffff;
      --input-border: #d1d5db;
    }
    [data-theme="dark"] {
      --bg: #111827;
      --text: #f3f4f6;
      --section-bg: #1f2937;
      --input-bg: #374151;
      --input-border: #4b5563;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      padding: 1rem;
      background: var(--orange);
      color: white;
      text-align: center;
      font-size: 1.5rem;
    }
    main {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 1rem auto;
      padding: 0 1rem;
    }
    /* Barre navigation inférieure */
    nav.tabs {
      display: flex;
      border-top: 1px solid var(--input-border);
      background: var(--section-bg);
      position: sticky;
      bottom: 0;
    }
    nav.tabs button {
      flex: 1;
      padding: 0.75rem;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
    }
    nav.tabs button.active {
      color: var(--orange);
      font-weight: bold;
      border-top: 2px solid var(--orange);
    }
    /* Sections promesses */
    .promises-section {
      margin-bottom: 2rem;
    }
    .promises-section h2 {
      font-size: 1.2rem;
      border-bottom: 2px solid var(--orange);
      padding-bottom: 0.25rem;
    }
    .promise-row {
      display: flex;
      align-items: center;
      background: var(--section-bg);
      border-radius: 8px;
      padding: 0.75rem;
      margin: 0.5rem 0;
      cursor: pointer;
    }
    .promise-row .status {
      font-size: 1.4rem;
      margin-right: 0.75rem;
    }
    .promise-row .content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .promise-row .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }
    .promise-row .progress-bar {
      height: 8px;
      background: var(--gray-light);
      border-radius: 4px;
      overflow: hidden;
      margin: 0.5rem 0;
    }
    .promise-row .progress {
      height: 100%;
      width: 0;
      background: var(--orange);
      transition: width 0.6s ease;
    }
    .promise-row .footer {
      font-size: 0.75rem;
      color: var(--gray-dark);
      display: flex;
      justify-content: space-between;
    }
    /* Formulaire ajout */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      justify-content: center;
      align-items: center;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--bg);
      padding: 1.5rem;
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
      max-height: 90%;
      overflow-y: auto;
    }
    .modal-content h3 { margin-top: 0; }
    .modal-content label { display: block; margin: 0.5rem 0 0.25rem; font-weight: 600; }
    .modal-content input,
    .modal-content textarea,
    .modal-content select { width: 100%; padding: 0.5rem; border: 1px solid var(--input-border); border-radius: 4px; background: var(--input-bg); color: var(--text); }
    .modal-content .actions { text-align: right; margin-top: 1rem; }
    .modal-content button { padding: 0.5rem 1rem; margin-left: 0.5rem; border: none; border-radius: 4px; cursor: pointer; }
    .btn-primary { background: var(--orange); color: white; }
    .btn-secondary { background: var(--gray-light); color: var(--text); }
    /* Search */
    #searchInput { width: 100%; padding: 0.5rem; margin-bottom: 1rem; border: 1px solid var(--input-border); border-radius: 4px; background: var(--input-bg); color: var(--text); }
  </style>
</head>
<body data-theme="light">
  <header>PromiseTracker Web</header>
  <main>
    <!-- Panel Suivi -->
    <section id="panel-tracking">
      <input type="search" id="searchInput" placeholder="Rechercher...">
      <button id="openAdd" class="btn-primary">➕ Ajouter une promesse</button>
      <div class="promises-section"><h2>Actives</h2><div id="list-active"></div></div>
      <div class="promises-section"><h2>Accomplies</h2><div id="list-completed"></div></div>
      <div class="promises-section"><h2>Échouées</h2><div id="list-failed"></div></div>
    </section>
    <!-- Panel Réglages -->
    <section id="panel-settings" hidden>
      <h2>Réglages</h2>
      <label><input type="checkbox" id="toggleDark"> Mode sombre</label>
      <label>Langue<select id="selectLang"><option value="fr">Français</option><option value="en">English</option></select></label>
      <label>Nom utilisateur<input type="text" id="inputName" placeholder="Votre nom"></label>
      <button id="btnTutorial" class="btn-secondary">Revoir tutoriel</button>
    </section>
    <!-- Panel Compte -->
    <section id="panel-account" hidden>
      <div style="text-align:center; padding:2rem;">
        <svg width="100" height="100" fill="var(--orange)"><circle cx="50" cy="32" r="24"/><path d="M0 100a50 50 0 01100 0H0z"/></svg>
        <p>Connectez-vous pour synchroniser vos promesses</p>
        <button class="btn-primary">Se connecter</button>
      </div>
    </section>
  </main>
  <nav class="tabs">
    <button data-target="panel-tracking" class="active">Suivi</button>
    <button data-target="panel-settings">Réglages</button>
    <button data-target="panel-account">Compte</button>
  </nav>
  <!-- Modal Ajout -->
  <div class="modal" id="modalAdd">
    <div class="modal-content">
      <h3>Nouvelle promesse</h3>
      <label for="title">Titre</label><input type="text" id="title">
      <label for="notes">Notes</label><textarea id="notes"></textarea>
      <label for="start">Début</label><input type="date" id="start">
      <label for="end">Fin</label><input type="date" id="end">
      <label for="priority">Priorité</label><select id="priority"><option value="0">Basse</option><option value="1" selected>Moyenne</option><option value="2">Haute</option></select>
      <div class="actions">
        <button id="cancelAdd" class="btn-secondary">Annuler</button>
        <button id="saveAdd" class="btn-primary">Ajouter</button>
      </div>
    </div>
  </div>
  <script>
    // Gestion onglets
    document.querySelectorAll('nav.tabs button').forEach(btn => btn.addEventListener('click', e => {
      document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
      e.currentTarget.classList.add('active');
      document.querySelectorAll('main > section').forEach(sec => sec.hidden = true);
      document.getElementById(e.currentTarget.dataset.target).hidden = false;
    }));
    // Dark mode toggle
    document.getElementById('toggleDark').addEventListener('change', e => {
      document.body.dataset.theme = e.target.checked ? 'dark':'light';
    });
    // Modal add
    const modal = document.getElementById('modalAdd');
    document.getElementById('openAdd').onclick = ()=> modal.classList.add('active');
    document.getElementById('cancelAdd').onclick = ()=> modal.classList.remove('active');
    document.getElementById('saveAdd').onclick = ()=> {
      // Logique ajout à implémenter
      modal.classList.remove('active');
    };
  </script>
</body>
</html>
